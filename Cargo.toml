[package]
name = "bevy_slang"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Runtime Slang shader compilation for Bevy"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/shader-slang/slang"
keywords = ["bevy", "shader", "slang", "spirv", "wgsl"]
categories = ["game-development", "graphics", "rendering"]

[features]
default = []
spirv_passthrough = ["bevy/spirv_shader_passthrough"]

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "bevy_asset",
    "bevy_shader",
    "shader_format_spirv",
] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"

[lints.rust]
missing_docs = "warn"

